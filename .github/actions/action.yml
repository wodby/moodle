name: push
description: combine multi-arch images and push
inputs:
  version:
    description: version
    required: true
  latest:
    description: if tag latest
    required: false
runs:
  using: "composite"
  steps:
  - name: Combine images
    env:
      MOODLE_VER: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
    run: |
      . $GITHUB_ACTION_PATH/release.sh
    shell: bash
