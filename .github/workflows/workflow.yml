name: Build docker image

on:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

env:
  BASE_IMAGE_REVISION: r14
  MOODLE53: '5.3.1'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      moodle-versions: ${{ steps.set-matrix.outputs.moodle-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "moodle53", "version": "${{ env.MOODLE53 }}", "php": "8.4", "latest": "latest"}
          ]
          EOF
          echo "moodle-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        moodle: ${{ fromJson(needs.setup.outputs.moodle-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build, test and push
        env:
          MOODLE_VER: ${{ matrix.moodle.version }}
          PHP_VER: ${{ matrix.moodle.php }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          if [[ "${{ github.event_name }}" != pull_request ]]; then make push; fi

  push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        moodle: ${{ fromJson(needs.setup.outputs.moodle-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.moodle.version }}
          latest: ${{ matrix.moodle.latest }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
